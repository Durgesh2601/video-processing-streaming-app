previews:
  generation: automatic

services:
  - name: video-processing-client
    type: web
    runtime: static
    plan: standard
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://video-processing-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - name: video-processing-api
    type: web
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: CLIENT_URL
        value: https://video-processing-client.onrender.com
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
